[package]
name = "checkpoint-guest"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
alloy-primitives = { version = "=1.5.3", default-features = false, features = ["rlp", "serde", "tiny-keccak"] }
alloy-sol-types = { version = "=1.5.3", default-features = false }
checkpoint-core = { path = "../../core" }
sp1-zkvm = { version = "=6.1.0", default-features = false, features = ["lib", "verify"] }
sha2 = { version = "0.10", default-features = false }

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.8-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

[profile.release]
lto = "thin"
opt-level = 3
