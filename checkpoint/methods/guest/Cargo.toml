[package]
name = "checkpoint-guest"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
alloy-primitives = { version = "1.5.3", default-features = false, features = ["rlp", "serde", "tiny-keccak"] }
alloy-sol-types = { version = "1.5.3", default-features = false }
checkpoint-core = { path = "../../core" }
risc0-steel = { git = "https://github.com/boundless-xyz/steel", rev = "f6fc6297c938d7acc0563337da136d034c3cb67b" }
risc0-zkvm = { version = "3.0", default-features = false, features = ["std"] }

revm = { version = "*", default-features = false, features = ["bn"] }
k256 = "=0.13.4"
substrate-bn = "=0.6.0"
tiny-keccak = "=2.0.2"

[patch.crates-io]
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
substrate-bn = { git = "https://github.com/risc0/paritytech-bn", tag = "v0.6.0-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
lto = "thin"
opt-level = 3
