[package]
name = "reciprocal-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
sp1-zkvm = { version = "=6.1.0", default-features = false, features = ["lib"] }
enforcement-core = { path = "../../enforcement-core" }
serde_json = "1"

[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

[profile.release]
lto = "thin"
opt-level = 3
