[workspace]
resolver = "2"
members = [
  "core",
  "enforcement-core",
  "host",
  "closed-cycle-methods",
  "reciprocal-methods",
]

[workspace.dependencies]
loop-core = { path = "core" }

alloy-primitives = { version = "=1.4.1", default-features = false, features = ["rlp", "serde"] }
alloy-consensus = { version = "=1.5.2", default-features = false, features = ["serde", "k256"] }
alloy-eips = { version = "=1.5.2", default-features = false }
alloy-network = { version = "=1.5.2" }
alloy-rlp = { version = "0.3", default-features = false }
alloy-trie = { version = "0.9", default-features = false, features = ["ethereum"] }
op-alloy-consensus = { version = "=0.18.0", features = ["alloy-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

sp1-build = { version = "=6.1.0" }
sp1-sdk = { version = "=6.1.0", default-features = false }

# Reduce proving time for release runs
[profile.release]
debug = 1
lto = true

[patch.crates-io]
alloy-signer-aws = { path = "vendor/alloy-signer-aws" }
