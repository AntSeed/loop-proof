[workspace]
resolver = "2"
members = [
  "core",
  "enforcement-core",
  "host",
  "methods",
  "closed-cycle-methods",
  "reciprocal-methods",
  "coordinated-control-methods",
]

[workspace.dependencies]
loop-core = { path = "core" }
methods = { path = "methods" }

alloy-primitives = { version = "=1.4.1", default-features = false, features = ["rlp", "serde"] }
alloy-consensus = { version = "=1.1.0", default-features = false, features = ["serde", "k256"] }
alloy-eips = { version = "=1.1.0", default-features = false }
alloy-network = { version = "=1.1.0" }
alloy-rlp = { version = "0.3", default-features = false }
alloy-trie = { version = "0.9", default-features = false, features = ["ethereum"] }
alloy-tx-macros = { version = "=1.1.0" }
op-alloy-consensus = { version = "=0.18.0", features = ["alloy-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

risc0-build = { version = "3.0" }

# Reduce proving time for release runs
[profile.release]
debug = 1
lto = true
