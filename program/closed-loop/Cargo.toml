[package]
name = "closed-loop-guest"
version = "0.1.0"
edition = "2021"

# Standalone workspace: built only with the SP1 toolchain
# (`cargo prove build`), never as part of the host workspace.
[workspace]

[dependencies]
sp1-zkvm = "=6.1.0"
sp1-lib = "=6.1.0"
wash-predicate = { path = "../../predicate" }
serde_json = "1"

[patch.crates-io]
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-k256-13.4-sp1-6.0.0" }
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", tag = "patch-2.0.2-sp1-6.0.0" }

[profile.release]
lto = "thin"
opt-level = 3
